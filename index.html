<!DOCTYPE html>
<html lang="en" class="bg-black text-gray-400">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y_ANALYSIS_TERMINAL // HIGH_YIELD_SILO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        .glitch-text { text-shadow: 2px 0 #10b981, -2px 0 #059669; }
        
        .targeting-sq {
            border: 2px solid #10b981;
            animation: shrinkSquare 3s ease-out forwards;
        }
        .crosshair-v {
            width: 1px;
            height: 400px;
            background: rgba(16, 185, 129, 0.4);
            animation: fadeOut 3s ease-out forwards;
        }
        .crosshair-h {
            width: 100%;
            height: 1px;
            background: rgba(16, 185, 129, 0.4);
            animation: fadeOut 3s ease-out forwards;
        }
        @keyframes shrinkSquare {
            0% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .ghost-text {
            color: transparent;
            text-shadow: 0 0 5px rgba(16, 185, 129, 0.4);
            animation: textScramble 2s infinite linear;
        }
        .scanline {
            position: relative;
            overflow: hidden;
        }
        .scanline::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        @keyframes textScramble {
            0% { opacity: 0.1; }
            50% { opacity: 0.5; }
            100% { opacity: 0.1; }
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        @keyframes scrolling {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
        @keyframes dash {
            0% { stroke-dasharray: 0, 200; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 100, 200; stroke-dashoffset: -50; }
            100% { stroke-dasharray: 100, 200; stroke-dashoffset: -200; }
        }
    </style>
</head>
<body class="bg-black text-gray-400 overflow-hidden">
    <div id="root" class="w-full h-screen"></div>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
